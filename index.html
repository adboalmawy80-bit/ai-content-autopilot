<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniPublish Core v2.4 | Enterprise Authentication & Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: #080c14; 
            background-image: linear-gradient(rgba(8, 12, 20, 0.85), rgba(8, 12, 20, 0.85)), 
                              url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #cbd5e1; 
            min-height: 100vh; 
            overflow-x: hidden;
            position: relative;
        }

        .aurora-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: float 14s infinite ease-in-out alternate;
        }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #06b6d4; animation-duration: 12s; }
        .blob-2 { bottom: -10%; right: -10%; width: 600px; height: 600px; background: #3b82f6; animation-duration: 16s; }
        .blob-3 { top: 40%; left: 40%; width: 350px; height: 350px; background: #8b5cf6; animation-duration: 10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.1); }
            100% { transform: translate(-30px, 50px) scale(0.95); }
        }

        header { 
            position: relative;
            z-index: 10;
            background-color: rgba(13, 18, 30, 0.75); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 14px 28px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .logo-box { display: flex; gap: 12px; align-items: center; }
        .brand-logo-svg { 
            width: 36px; height: 36px; 
            filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.6));
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.4)); }
            100% { filter: drop-shadow(0 0 16px rgba(6, 182, 212, 0.9)); }
        }

        .brand-name { font-size: 18px; font-weight: 700; color: #f8fafc; letter-spacing: 1px; }
        .brand-name span { color: #06b6d4; }
        .badge { background: rgba(30, 41, 59, 0.8); color: #94a3b8; border: 1px solid #334155; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-family: monospace; }
        .status-bar { font-size: 12px; color: #64748b; font-family: monospace; display: flex; gap: 12px; align-items: center; }
        .dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 8px #10b981; }

        .login-wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 20px;
        }
        
        .login-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 40px 32px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(6, 182, 212, 0.15);
            text-align: center;
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.5s, opacity 0.5s;
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card.exit-anim {
            opacity: 0;
            transform: translateY(-20px) scale(0.96);
            pointer-events: none;
        }

        .login-card.shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .login-title { font-size: 22px; font-weight: 700; color: #f8fafc; margin-top: 16px; margin-bottom: 6px; }
        .login-subtitle { font-size: 13px; color: #64748b; margin-bottom: 28px; }

        .main-container { 
            position: relative;
            z-index: 5;
            max-width: 1150px; 
            margin: 30px auto; 
            padding: 0 20px; 
            display: grid; 
            grid-template-columns: 1fr 1.3fr; 
            gap: 24px; 
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 850px) { .main-container { grid-template-columns: 1fr; } }

        .card { 
            background: rgba(17, 24, 39, 0.75); 
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 16px; 
            padding: 24px; 
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5); 
        }
        .card-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 12px; font-weight: 500; color: #94a3b8; margin-bottom: 6px; }
        input, select, textarea { 
            width: 100%; 
            background-color: rgba(11, 15, 25, 0.85); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #f1f5f9; 
            border-radius: 10px; 
            padding: 12px 14px; 
            font-size: 13px; 
            outline: none; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        input:focus, select:focus, textarea:focus { 
            border-color: #06b6d4; 
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
            background-color: rgba(11, 15, 25, 0.95);
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-primary { 
            width: 100%; 
            background: linear-gradient(135deg, #0891b2 0%, #0284c7 100%); 
            color: #ffffff; 
            font-weight: 600; 
            border: none; 
            padding: 13px; 
            border-radius: 10px; 
            font-size: 13px; 
            cursor: pointer; 
            margin-top: 8px; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.2);
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, #06b6d4 0%, #0369a1 100%);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-secondary { background-color: #1e293b; border: 1px solid #334155; color: #cbd5e1; font-weight: 500; padding: 10px 18px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .btn-secondary:hover:not(:disabled) { background-color: #334155; color: #fff; }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

        textarea.terminal { font-family: "Courier New", Courier, monospace; color: #22d3ee; height: 260px; resize: none; line-height: 1.6; }
        .action-row { display: flex; justify-content: flex-end; margin-top: 16px; }
        .hidden { display: none !important; }
        .text-emerald { color: #10b981; }
    </style>
</head>
<body>

    <div class="aurora-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header>
        <div class="logo-box">
            <svg class="brand-logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L3 7V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V7L12 2Z" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 8V16M8 12H16" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div class="brand-name">OMNI<span>CORE</span></div>
            <span class="badge">AES-256 SECURED</span>
        </div>
        <div class="status-bar">
            <span><span class="dot"></span> DB ENCRYPTED</span>
            <span>|</span>
            <span id="sessionStatus">AUTH REQUIRED</span>
            <button id="logoutBtn" class="btn-secondary hidden" style="padding: 4px 10px; margin-left: 10px; background: #dc2626; border: none; color: white;">Logout 🚪</button>
        </div>
    </header>

    <div id="loginView" class="login-wrapper">
        <div class="login-card" id="loginCard">
            <svg class="brand-logo-svg" style="width: 52px; height: 52px;" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L3 7V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V7L12 2Z" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="2"/>
                <path d="M12 8V16M8 12H16" stroke="#22d3ee" stroke-width="2"/>
            </svg>
            <div class="login-title">Enterprise Access</div>
            <div class="login-subtitle">Enter credentials to unlock encryption workspace</div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Username / API Key ID</label>
                    <input type="text" id="username" required placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Secure Key Passcode</label>
                    <input type="password" id="password" required placeholder="admin123">
                </div>
               <button type="button" id="loginBtn">Authenticate Session ➔</button>
            </form>
        </div>
    </div>

    <div id="workspaceView" class="main-container hidden">
        
        <div class="card">
            <div class="card-title">⚙️ Content Engine Parameters</div>
            
            <form id="aiForm">
                <div class="form-group">
                    <label>Target Subject / Campaign</label>
                    <input type="text" id="topic" required placeholder="e.g. Cloud Infrastructure Security Trends">
                </div>

                <div class="grid-2 form-group">
                    <div>
                        <label>Distribution Channel</label>
                        <select id="platform">
                            <option value="LinkedIn">LinkedIn Corporate</option>
                            <option value="Twitter">X / Tech Feed</option>
                            <option value="Facebook">Meta Network</option>
                        </select>
                    </div>
                    <div>
                        <label>Tone Profile</label>
                        <select id="tone">
                            <option value="Executive Briefing">Executive Briefing</option>
                            <option value="Technical Analysis">Technical Analysis</option>
                            <option value="Marketing Insight">Marketing Insight</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="generateBtn" class="btn-primary">⚡ Compile Content Payload</button>
            </form>
        </div>

        <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <div class="card-title">
                    <span>💻 Payload Inspector</span>
                    <span id="encStatus" class="badge text-emerald hidden">🔒 AES-256 Buffer Ready</span>
                </div>

                <textarea id="generatedContent" class="terminal" readonly placeholder="// Engine output will be rendered here securely..."></textarea>
            </div>

            <div class="action-row">
                <button id="saveBtn" disabled class="btn-secondary">💾 Commit to Encrypted Storage</button>
            </div>
        </div>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
